<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <meta name="description" content="A Spotify clone using the iTunes Search API">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Circular+Std:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="ph-fill ph-spotify-logo"></i>
                <span>Spotify</span>
            </div>
            <nav class="nav-links">
                <a href="#" class="nav-item">
                    <i class="ph-fill ph-house"></i>
                    <span>Home</span>
                </a>
                <a href="#" class="nav-item active" id="nav-search">
                    <i class="ph ph-magnifying-glass"></i>
                    <span>Search</span>
                </a>
                <a href="#" class="nav-item" id="nav-radio">
                    <i class="ph ph-radio"></i>
                    <span>Live Radio</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="ph ph-books"></i>
                    <span>Your Library</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-view">
            <!-- Topbar -->
            <header class="topbar">
                <div class="search-container">
                    <i class="ph ph-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="What do you want to listen to?" value="Top Hits">
                </div>
                <div class="user-profile">
                    <i class="ph-fill ph-user-circle"></i>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <h2 id="results-title">Search Results</h2>
                
                <!-- Track List Header -->
                <div class="track-list-header">
                    <div class="col-title"># Title</div>
                    <div class="col-album">Album</div>
                    <div class="col-time"><i class="ph ph-clock"></i></div>
                </div>

                <!-- Tracks Container -->
                <div class="tracks-container" id="tracks-container">
                    <!-- Dynamic Tracks injected here -->
                    <div class="loading-state">Search for your favorite artists or songs...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bottom Player -->
    <footer class="bottom-player">
        <!-- Audio Element (Hidden) -->
        <audio id="audio"></audio>

        <!-- Left: Track Info -->
        <div class="player-left">
            <img src="" alt="Album Art" id="player-art" class="hidden">
            <div class="player-track-info">
                <div id="player-title" class="player-title"></div>
                <div id="player-artist" class="player-artist"></div>
            </div>
        </div>

        <!-- Center: Controls & Progress -->
        <div class="player-center">
            <div class="player-controls">
                <button class="icon-btn" aria-label="Shuffle"><i class="ph ph-shuffle"></i></button>
                <button class="icon-btn" id="prev" aria-label="Previous"><i class="ph-fill ph-skip-back"></i></button>
                <button class="play-btn" id="play" aria-label="Play/Pause"><i class="ph-fill ph-play" id="play-icon"></i></button>
                <button class="icon-btn" id="next" aria-label="Next"><i class="ph-fill ph-skip-forward"></i></button>
                <button class="icon-btn" aria-label="Repeat"><i class="ph ph-repeat"></i></button>
            </div>
            <div class="progress-section" id="progress-section">
                <span id="current-time" class="time-text">0:00</span>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                        <div class="progress-thumb" id="progress-thumb"></div>
                    </div>
                </div>
                <span id="duration" class="time-text">0:30</span>
            </div>
            <div class="live-indicator hidden" id="live-indicator">
                <div class="live-dot"></div> LIVE RADIO
            </div>
        </div>

        <!-- Right: Volume -->
        <div class="player-right">
            <i class="ph ph-speaker-high volume-icon"></i>
            <div class="volume-container" id="volume-container">
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                <div class="volume-progress" id="volume-progress"></div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
